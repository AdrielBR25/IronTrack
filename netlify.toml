# IronTrack na Netlify (Prompt 21). Passo a passo em docs/NUVEM_IMPLANTACAO.md.
# Variáveis configuradas no PAINEL da Netlify (não aqui): API_PROXY_TARGET (origem HTTPS da API na Railway).
# Nada secreto vai para o build: o app só conhece a mesma origem (/api), atendida pelo proxy abaixo.

[build]
  base = "/"
  publish = "dist"
  command = "npm run build && node scripts/netlify-redirects.mjs"

[build.environment]
  NODE_VERSION = "22.18.0"
  BASE_PATH = "/"
  VITE_ACCOUNTS = "on"

# Cabeçalhos de segurança do app. CSP: tudo da própria origem; a API também é da própria origem (proxy).
# 'unsafe-inline' só em estilos (animações e Tailwind geram atributos style); scripts nunca.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"

# O service worker e o HTML precisam ser conferidos sempre (atualização do PWA).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
